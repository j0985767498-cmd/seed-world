<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>種子的世界</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6EDDC;--paper:#FAFCF5;--ink:#25311E;--muted:#5D6A53;--line:#CBD5BD;
  --soilTop:#9B6B45;--soil:#7A5236;--soil2:#5C3D27;--grass:#9DC27B;--grass2:#7FA660;--grass3:#6A8F4E;
  --leaf:#3F7B38;--mustard:#D8A42C;--water:#3F86C4;--danger:#B4452F;--chip:#EDF2E4;--accent:#3F7B38;--onAccent:#FFFFFF;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1A2016;--paper:#232B1E;--ink:#E5ECDA;--muted:#A3AF94;--line:#3A4632;
    --soilTop:#80583A;--soil:#664530;--soil2:#4B3222;--grass:#5E7D46;--grass2:#4C6738;--grass3:#3E552E;
    --leaf:#78B866;--mustard:#E6B84D;--water:#6AA8DE;--danger:#E58069;--chip:#2D3727;--accent:#78B866;--onAccent:#14200F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1A2016;--paper:#232B1E;--ink:#E5ECDA;--muted:#A3AF94;--line:#3A4632;
  --soilTop:#80583A;--soil:#664530;--soil2:#4B3222;--grass:#5E7D46;--grass2:#4C6738;--grass3:#3E552E;
  --leaf:#78B866;--mustard:#E6B84D;--water:#6AA8DE;--danger:#E58069;--chip:#2D3727;--accent:#78B866;--onAccent:#14200F;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-size:16px;line-height:1.6;-webkit-tap-highlight-color:transparent}
main{max-width:480px;margin:0 auto;padding:16px 16px 110px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:8px}
h1{font-family:"Noto Serif TC","Songti TC",serif;font-size:26px;line-height:1.2;margin:0;letter-spacing:.04em}
.sub{font-size:13px;color:var(--muted);margin:2px 0 0}
.coins{display:flex;align-items:center;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 6px;font-weight:500;white-space:nowrap}
.coin{width:20px;height:20px;border-radius:50%;background:var(--mustard);box-shadow:inset 0 0 0 3px rgba(255,255,255,.35)}
#farm{width:100%;height:auto;display:block;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.tools{display:flex;gap:12px;justify-content:center;margin:10px 0 4px}
.tool{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:6px 16px;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:grab;font-size:13px}
#ghost{position:fixed;left:0;top:0;pointer-events:none;z-index:50;display:none;transform:translate(-50%,-115%);text-align:center}
#ghost .gl{display:block;background:var(--ink);color:var(--paper);font-size:12px;border-radius:999px;padding:2px 8px;white-space:nowrap;margin-top:2px}
.mini{border:1px solid var(--line);background:var(--chip);border-radius:8px;padding:0 8px;font-size:13px;margin-left:4px;vertical-align:middle}
.rename{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.rename input{font:inherit;width:8.5em;padding:4px 8px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
.err{color:var(--danger);font-size:13px}
#farm [data-plot]{cursor:pointer}
.hint{text-align:center;color:var(--muted);font-size:14px;margin:4px 0 0;min-height:22px}
h2{font-family:"Noto Serif TC","Songti TC",serif;font-size:20px;margin:8px 0 12px}
.lot{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.lot-top{display:flex;gap:12px;align-items:center}
.lot-name{font-weight:700;font-size:17px}
.meta{font-size:13px;color:var(--muted)}
.sims{display:flex;gap:4px;align-items:center;margin-top:8px;flex-wrap:wrap}
.sims .lbl{font-size:12px;color:var(--muted);width:100%}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);display:flex;justify-content:center;gap:8px;padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));z-index:20}
nav button{flex:1;max-width:220px;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:500;padding:8px;border-radius:10px}
nav button[aria-current="page"]{background:var(--chip);color:var(--ink)}
button{font:inherit;color:inherit}
.btn{display:block;width:100%;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:12px;font-weight:500;margin-top:8px;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--onAccent)}
.btn.warn{color:var(--danger)}
.btn:disabled{opacity:.5}
.btn:focus-visible,nav button:focus-visible{outline:3px solid var(--mustard);outline-offset:2px}
.row2{display:flex;gap:8px}.row2 .btn{flex:1}
#backdrop{position:fixed;inset:0;background:rgba(10,20,5,.45);display:none;z-index:30}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:86vh;overflow-y:auto;background:var(--paper);border-radius:20px 20px 0 0;padding:8px 18px calc(18px + env(safe-area-inset-bottom,0px));z-index:31;transform:translateY(105%);transition:transform .22s ease}
#sheet.open{transform:none}
@media (prefers-reduced-motion: reduce){#sheet{transition:none}}
.grip{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.sheet-wrap{max-width:480px;margin:0 auto}
.stage{font-size:13px;color:var(--muted)}
.bar{height:10px;background:var(--chip);border-radius:6px;overflow:hidden;margin:6px 0}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:6px}
.stat{display:grid;grid-template-columns:5.5em 1fr 3.4em;gap:8px;align-items:center;font-size:14px;margin:4px 0}
.stat .v{text-align:right;font-weight:500;font-variant-numeric:tabular-nums}
.stat .bar{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0 10px}
.chip{background:var(--chip);border-radius:999px;padding:2px 10px;font-size:13px}
.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.score{background:var(--chip);border-radius:12px;padding:8px;text-align:center}
.score b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.score span{font-size:12px;color:var(--muted)}
.badges{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.badge{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:1px 10px}
.badge.r1{border-color:#5E9BC8}.badge.r2{border-color:#9B6CC8}.badge.r3{border-color:var(--mustard);font-weight:700}
.hero{display:flex;justify-content:center}
.pick{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:8px 10px;margin-top:8px}
.pick .meta{display:block}
.note{font-size:13px;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.settings{margin-top:24px;border-top:1px solid var(--line);padding-top:12px}
#login{position:fixed;inset:0;background:var(--bg);z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
#login[hidden]{display:none}
#login h1{font-size:34px;margin-bottom:6px}
#login .btn{max-width:320px}
.sync{font-size:12px;color:var(--muted);text-align:right;margin-top:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.filters{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;-webkit-overflow-scrolling:touch}
.fchip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 12px;white-space:nowrap;font-size:14px;flex:none}
.fchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--onAccent)}
h3{font-family:"Noto Serif TC","Songti TC",serif;font-size:17px;margin:16px 0 8px}
.sellbox label{display:block;font-size:14px;margin-top:8px}
.sellbox input,.regbox input{display:block;width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);margin-top:4px}
.regbox{background:var(--chip);border-radius:12px;padding:10px 12px;margin:12px 0}
nav button{padding:8px 2px;font-size:15px}
#farmWrap,.farmWrap{overflow-x:auto;overflow-y:hidden;border-radius:16px;-webkit-overflow-scrolling:touch}
#farmWrap{touch-action:none}
.farmWrap.v{touch-action:pan-x}
#farm,.farmsvg{width:322%;max-width:none;height:auto;display:block}
.modes{display:flex;gap:6px;margin:4px 0 8px;align-items:center}
.modes .fchip{font-size:14px}
.modes .sp{flex:1}
#farmBox{position:relative}
#joy{position:absolute;left:10px;bottom:10px;width:104px;height:104px;border-radius:50%;background:rgba(255,255,255,.35);border:2px solid rgba(0,0,0,.15);touch-action:none;z-index:5}
#joyKnob{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:var(--paper);border:2px solid var(--line);box-shadow:0 2px 6px rgba(0,0,0,.2);pointer-events:none}
#actBtn{position:absolute;right:12px;bottom:22px;width:78px;height:78px;border-radius:50%;border:0;background:var(--accent);color:var(--onAccent);font-weight:700;font-size:16px;z-index:5;box-shadow:0 2px 6px rgba(0,0,0,.2)}
#visitBar{display:flex;align-items:center;gap:8px;background:var(--chip);border-radius:12px;padding:6px 10px;margin-bottom:8px;font-size:14px}
#visitBar[hidden]{display:none}
#visitBar span{flex:1}
.decorItems{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.ditem{flex:none;display:flex;flex-direction:column;align-items:center;font-size:12px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:4px 6px;width:70px}
.ditem[aria-pressed="true"]{border:2px solid var(--mustard)}
.avrow{display:grid;grid-template-columns:5.5em 1fr;align-items:center;gap:6px;margin:6px 0}
.avrow b{text-align:center;font-weight:500}
.avrow:has(b){grid-template-columns:5.5em auto 1fr auto}
.sw{display:flex;flex-wrap:wrap;gap:6px}
.swatch{width:28px;height:28px;border-radius:50%;border:2px solid var(--line)}
.swatch[aria-pressed="true"]{border:3px solid var(--ink)}
#tut{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom,0px));width:min(460px,calc(100vw - 24px));background:var(--paper);border:2px solid var(--mustard);border-radius:16px;padding:10px 12px;z-index:25;box-shadow:0 4px 14px rgba(0,0,0,.18)}
#tut[hidden]{display:none}
.tuth{display:flex;align-items:center;gap:8px;font-weight:700}
.tuth .stp{margin-left:auto;font-size:12px;color:var(--muted);font-weight:400}
#tutText{margin:6px 0;font-size:15px}
.tutb{display:flex;gap:8px;justify-content:flex-end}
.tutb button{font:inherit;font-size:14px;border-radius:10px;padding:6px 12px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
#tutNext{background:var(--accent);color:var(--onAccent);border-color:var(--accent)}
.tool{font:inherit;font-size:13px;color:var(--ink)}
.bagtools{display:flex;gap:8px;align-items:flex-start}
.bagtools .filters{flex:1;min-width:0}
.sortl{font-size:13px;color:var(--muted);white-space:nowrap;display:flex;flex-direction:column}
.sortl select{font:inherit;font-size:14px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:4px 6px}
.lotrow{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:8px 10px;margin-bottom:8px}
.lr{display:flex;flex-direction:column;min-width:0}
.friend{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid var(--line)}
.friend b{flex:1}
#chat,.chatbox{max-height:50vh;overflow-y:auto;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:8px}
.msg{margin:6px 0;padding:6px 10px;background:var(--chip);border-radius:12px;max-width:85%;width:fit-content;word-break:break-word}
.msg.me{margin-left:auto;background:var(--accent);color:var(--onAccent)}
.msg .who{display:block;font-size:12px;opacity:.75}
.chatbar{display:flex;gap:6px;margin-top:8px}
.chatbar input{flex:1;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);min-width:0}
.mini.big{padding:6px 14px;font-size:15px}

body.game{overflow:hidden;position:fixed;inset:0;touch-action:none;overscroll-behavior:none}
#scene{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;display:block;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.hudTop{position:fixed;left:10px;top:calc(8px + env(safe-area-inset-top,0px));z-index:10;display:flex;flex-direction:column;gap:4px;align-items:flex-start;pointer-events:none}
.sceneName{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:2px 12px;font-size:13px;font-weight:500}
.hudTop .sync{text-align:left;background:var(--paper);border-radius:8px;padding:0 6px;opacity:.9}
.hudTop .sync:empty{display:none}
#iconbar{position:fixed;right:8px;top:calc(8px + env(safe-area-inset-top,0px));z-index:10;display:flex;flex-direction:column;gap:6px}
#iconbar button{width:54px;height:52px;border-radius:14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;font:inherit;font-size:11px;line-height:1.2;position:relative;padding:2px;box-shadow:0 1px 4px rgba(0,0,0,.14)}
#iconbar button[hidden]{display:none}
#iconbar svg{width:24px;height:24px;margin-bottom:1px}
#ordersBadge{position:absolute;top:-5px;right:-5px;background:var(--danger);color:#fff;border-radius:999px;font-style:normal;font-size:11px;min-width:18px;height:18px;line-height:18px;text-align:center}
#ordersBadge[hidden]{display:none}
#joy{position:fixed;left:18px;bottom:calc(24px + env(safe-area-inset-bottom,0px));width:124px;height:124px;border-radius:50%;background:rgba(255,255,255,.35);border:2px solid rgba(0,0,0,.18);touch-action:none;z-index:10}
#joyKnob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:var(--paper);border:2px solid var(--line);box-shadow:0 2px 6px rgba(0,0,0,.22);pointer-events:none}
#actBtn{position:fixed;right:20px;bottom:calc(30px + env(safe-area-inset-bottom,0px));width:92px;height:92px;border-radius:50%;border:0;background:var(--accent);color:var(--onAccent);font:inherit;font-weight:700;font-size:18px;z-index:10;box-shadow:0 3px 8px rgba(0,0,0,.25);touch-action:manipulation}
#actBtn.off{opacity:.55}
.sbtn{position:fixed;width:60px;height:60px;border-radius:50%;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;font-size:13px;font-weight:500;z-index:10;line-height:1.2;box-shadow:0 2px 6px rgba(0,0,0,.18);touch-action:manipulation}
.sbtn[hidden]{display:none}
#fertBtn{right:124px;bottom:calc(34px + env(safe-area-inset-bottom,0px))}
#fertBtn.off{opacity:.55}
#waterAll{right:36px;bottom:calc(136px + env(safe-area-inset-bottom,0px))}
#decorEdit{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(170px + env(safe-area-inset-bottom,0px));background:var(--paper);border:2px solid var(--mustard);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;z-index:12;width:min(440px,calc(100vw - 24px))}
#decorEdit[hidden]{display:none}
#pdim{position:fixed;inset:0;background:rgba(10,20,5,.4);z-index:28}
#pdim[hidden]{display:none}
.panel{position:fixed;left:0;right:0;bottom:0;top:calc(6vh + env(safe-area-inset-top,0px));background:var(--paper);border-radius:20px 20px 0 0;z-index:29;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.panel[hidden]{display:none}
.ph{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--line)}
.ph h2{margin:0}
.pb{overflow-y:auto;padding:12px 16px calc(28px + env(safe-area-inset-bottom,0px));flex:1;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.xbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--chip);color:var(--ink);font-size:18px;flex:none}
#sheet{touch-action:pan-y;padding-top:0}
.shead{position:sticky;top:0;background:var(--paper);display:flex;align-items:center;justify-content:center;height:46px;z-index:3;margin:0 -18px 4px}
.shead .grip{margin:0}
#sheetX{position:absolute;right:12px;top:4px}
.decorItems{flex-wrap:wrap;overflow:visible}
.ditem{width:76px}
#tut{left:10px;right:auto;transform:none;top:calc(84px + env(safe-area-inset-top,0px));bottom:auto;width:min(420px,calc(100vw - 92px))}
#toast{top:calc(120px + env(safe-area-inset-top,0px));bottom:auto}
.settings{margin-top:0;border-top:0;padding-top:0}
:root{--paper:#FFF8E7;--chip:#F8E8C4;--line:#E2C796;--ink:#3A2416;--muted:#7A5A3A;--accent:#4FAE2E;--onAccent:#FFFFFF;--bg:#8FD45E;--danger:#C23B22;--mustard:#F2B01E}
body.game{background:#5E9E38}
#iconbar button{border:2px solid #5A3416;background:#FFF6DE;color:#5A3416;box-shadow:0 3px 0 #5A3416;border-radius:16px;font-weight:700}
#iconbar button:active{transform:translateY(2px);box-shadow:0 1px 0 #5A3416}
.hudTop .coins,.sceneName{border:2px solid #5A3416;background:#FFF6DE;color:#5A3416;font-weight:700;box-shadow:0 2px 0 #5A3416}
#actBtn{background:#5DBB3A;border:3px solid #2F6B1E;box-shadow:0 5px 0 #2F6B1E;text-shadow:0 2px 0 #2F6B1E}
#actBtn:active{transform:translateY(3px);box-shadow:0 2px 0 #2F6B1E}
.sbtn{border:2px solid #5A3416;background:#FFF6DE;color:#5A3416;box-shadow:0 3px 0 #5A3416;font-weight:700}
#joy{background:rgba(255,255,255,.4);border:3px solid rgba(90,52,22,.55)}
#joyKnob{background:#FFF6DE;border:3px solid #5A3416;box-shadow:0 3px 0 #5A3416}
.panel{background:#FFF8E7;border:3px solid #5A3416;border-bottom:0}
.ph{background:#F6D9A0;border-bottom:3px solid #5A3416;border-radius:16px 16px 0 0}
.ph h2{color:#5A3416}
.xbtn{border:2px solid #5A3416;background:#FFF6DE;color:#5A3416;font-weight:700;box-shadow:0 2px 0 #5A3416}
#sheet{background:#FFF8E7;border:3px solid #5A3416;border-bottom:0}
.shead{background:#FFF8E7}
.btn{border:2px solid #5A3416;box-shadow:0 3px 0 rgba(90,52,22,.55);font-weight:700;color:#5A3416;background:#FFF6DE}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(90,52,22,.55)}
.btn.primary{background:#5DBB3A;border-color:#2F6B1E;color:#fff;box-shadow:0 3px 0 #2F6B1E;text-shadow:0 1px 0 #2F6B1E}
.btn.warn{color:#B23A1E}
.lot,.lotrow,.pick{border:2px solid #E2C796;background:#FFFDF6}

<script>
const LS_KEY='seedworld_stage1_v1';
const HOUR=3600e3;
const S=Math.sin,C=Math.cos,P=Math.pow,ab=Math.abs,sg=Math.sign,sq=Math.sqrt;
const ell=(sx,sy)=>t=>[sx*S(t),-sy*C(t)];
const tearUp=(sx,sy)=>t=>{const m=P(ab(S(t/2)),0.9);return [sx*S(t)*m,-sy*C(t)+0.1]};
const tearDown=(sx,sy)=>t=>{const m=P(ab(C(t/2)),0.9);return [sx*S(t)*m,-sy*C(t)-0.1]};
const heart=t=>[P(S(t),3),-(13*C(t)-5*C(2*t)-2*C(3*t)-C(4*t))/16-0.15];
const star=(n,r0,a)=>t=>{const r=r0+a*C(n*t);return [r*S(t),-r*C(t)]};
const spindle=(sx,sy)=>t=>[sx*S(t)*P(ab(S(t)),0.35),-sy*C(t)];
const superE=(sx,sy,e=0.4)=>t=>[sx*sg(S(t))*P(ab(S(t)),e),-sy*sg(C(t))*P(ab(C(t)),e)];
const bend=(f,k)=>t=>{const [x,y]=f(t);return [x+k*y*y-k*0.4,y]};
const wav=(f,k,fr)=>t=>{const [x,y]=f(t);return [x+k*S(fr*y),y]};
const rot=f=>t=>{const [x,y]=f(t);return [-y,x]};
const lobe=(f,n,a)=>t=>{const [x,y]=f(t),r=1+a*C(n*t);return [x*r,y*r]};
const flatB=(f,cut)=>t=>{const [x,y]=f(t);return [x,y>cut?cut+(y-cut)*0.25:y]};
const gourd=t=>{const y=-1.125*C(t)-0.025;const ft=y<-0.05?0.45*sq(Math.max(0,1-((y+0.6)/0.55)**2)):0;const fb=y>-0.3?0.72*sq(Math.max(0,1-((y-0.4)/0.7)**2)):0;return [sg(S(t))*Math.max(ft,fb,0.15),y]};

const CROPS={
  tomato:{n:'番茄',short:'番茄',min:6,price:10,body:'bush',fl:'#F3CC45',fx:3,fy:-34,fs:50,deco:'calyx',ribs:true,bumps:true,shapes:['圓形','扁圓','水滴','愛心','星形'],surf:['光滑','稜紋','瘤狀'],tpl:[ell(1,1),ell(1.18,0.8),tearUp(1.15,1.05),heart,star(5,.72,.33)]},
  strawberry:{n:'草莓',short:'草莓',min:5,price:8,body:'rosette',fl:'#FFFFFF',fx:12,fy:-12,fs:36,deco:'berry',ribs:true,bumps:false,shapes:['圓錐','圓球','扁扇','愛心','星形'],surf:['光滑','淺溝','深溝'],tpl:[tearDown(1,1.1),ell(1,1),tearDown(1.35,0.8),heart,star(5,.72,.3)]},
  zucchini:{n:'櫛瓜',short:'櫛瓜',min:6,price:10,body:'vine',fl:'#F2B632',fx:12,fy:-14,fs:48,deco:'stem',ribs:true,bumps:true,shapes:['長棒','圓球','飛碟','葫蘆','星形'],surf:['光滑','稜紋','瘤狀'],tpl:[superE(0.38,1.2),ell(1,1),lobe(ell(1.25,0.55),10,0.1),gourd,star(5,.7,.3)]},
  bittergourd:{n:'苦瓜',short:'苦瓜',min:8,price:13,body:'vine',fl:'#F3D44A',fx:12,fy:-16,fs:48,deco:'warts',ribs:false,bumps:false,shapes:['紡錘','短圓','細長','彎月','螺旋'],surf:['淺瘤','稜紋','深瘤'],tpl:[spindle(0.6,1.2),ell(0.85,0.95),spindle(0.38,1.35),bend(spindle(0.42,1.25),0.7),wav(spindle(0.45,1.25),0.22,4)]},
  corn:{n:'玉米',short:'玉米',min:9,price:15,body:'tall',fl:'#D8C27A',fx:10,fy:-50,fs:46,deco:'kernels',ribs:false,bumps:false,shapes:['圓柱','錐形','短胖','彎月','螺旋'],surf:['飽滿','皺粒','爆裂粒'],tpl:[superE(0.5,1.15),tearDown(0.65,1.15),superE(0.68,0.85),bend(superE(0.45,1.15),0.5),wav(superE(0.48,1.15),0.18,4)]},
  broccoli:{n:'花椰菜',short:'花椰',min:10,price:17,body:'rosette',fl:'#F3E36A',fx:0,fy:-26,fs:52,deco:'florets',ribs:false,bumps:false,shapes:['圓頂','扁平','尖塔','螺旋塔','愛心'],surf:['細密','顆粒','捲曲'],tpl:[flatB(ell(1.15,0.95),0.35),flatB(ell(1.3,0.65),0.3),tearUp(1,1.1),lobe(tearUp(1,1.1),9,0.07),heart]},
  sweetpotato:{n:'甘藷',short:'甘藷',min:13,price:22,body:'vine',fl:'#C9A3E0',fx:10,fy:-6,fs:46,deco:'roots',ribs:false,bumps:true,shapes:['紡錘','圓球','長條','心形','捲曲'],surf:['光滑','凹紋','瘤狀'],tpl:[rot(spindle(0.55,1.3)),ell(0.95,0.95),rot(spindle(0.35,1.45)),heart,rot(wav(spindle(0.45,1.3),0.22,4))]},
  melon:{n:'哈密瓜',short:'蜜瓜',min:15,price:25,body:'vine',fl:'#F3CC45',fx:12,fy:-14,fs:48,deco:'net',ribs:false,bumps:false,shapes:['圓球','橢圓','扁圓','愛心','星形'],surf:['光滑','淺網紋','深網紋'],tpl:[ell(1,1),ell(0.85,1.1),ell(1.2,0.82),heart,star(5,.75,.28)]}
};
const CROP_KEYS=Object.keys(CROPS);
const ANCH=[0.15,0.40,0.60,0.77,0.93],SHAPE_T=[0,0,1,2,3];
const SURF={S:{d:0,t:0},R:{d:1,t:1},B:{d:2,t:2}};
const PAT={N:{n:'無花紋',d:0,t:0},T:{n:'條紋',d:1,t:1},D:{n:'斑點',d:2,t:2},G:{n:'漸層',d:3,t:3}};
const COLOR_T={'紅':0,'黃':0,'橙':1,'綠':1,'紫':2,'白':2,'黑褐':3,'粉':3,'藍':7,'金':7,'彩虹':9};
const COLOR_ORDER=['彩虹','金','藍','紅','橙','黃','綠','紫','白','粉','黑褐'];
const TIERS=['普通','少見','稀有','傳說'];
const GERM=[0.9,0.8,0.65,0.5],SEEDN=[6,5,4,2];
const GROUPS={yield:10,taste:10,speed:10,resist:10,shape:8,ratio:4,twist:4,pr:4,py:4,pp:4,pg:4};
const LOCI=[];
for(const [g,n] of Object.entries(GROUPS))for(let i=0;i<n;i++)LOCI.push({k:g+i,g,type:'c',i});
LOCI.push({k:'surf',g:'surf',type:'d'});LOCI.push({k:'pat',g:'pat',type:'d'});LOCI.push({k:'spec',g:'spec',type:'d'});
const ML=LOCI.filter(L=>L.k!=='spec');
const DEFL={spec:['n','n']};const gl=(g,k)=>g[k]||DEFL[k];
const SPEC={n:{d:3},b:{d:2},a:{d:1},r:{d:0}},SPEC_N={b:'藍',a:'金',r:'彩虹'};

const rnd=Math.random;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const r3=v=>Math.round(v*1000)/1000;
const gauss=()=>{let u=0,v=0;while(!u)u=rnd();while(!v)v=rnd();return sq(-2*Math.log(u))*C(2*Math.PI*v)};
const clone=g=>JSON.parse(JSON.stringify(g));
const norm=v=>String(v).toLowerCase().replace(/\s+/g,'');
const glen=v=>Array.from(v).length;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pickIdx=(n,k)=>shuffle([...Array(n).keys()]).slice(0,k);
const rr=r=>r[0]+rnd()*(r[1]-r[0]);
function esc(v){return String(v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function gamete(g){const o={};for(const L of LOCI)o[L.k]=gl(g,L.k)[rnd()<.5?0:1];return o}
function combine(a,b){const g={};for(const L of LOCI)g[L.k]=[a[L.k],b[L.k]];return g}
function mutate(g){
  if(rnd()>=0.001)return false;
  const L=ML[Math.floor(rnd()*ML.length)],i=rnd()<.5?0:1;
  if(L.type==='c')g[L.k][i]=r3(clamp(g[L.k][i]+gauss()*0.2,0,1));
  else{const opts=Object.keys(L.k==='surf'?SURF:PAT).filter(x=>x!==g[L.k][i]);g[L.k][i]=opts[Math.floor(rnd()*opts.length)]}
  return true;
}
function child(m,f){const g=combine(gamete(m),gamete(f));let mu=mutate(g);if(rnd()<0.002){const r=rnd();g.spec[rnd()<.5?0:1]=r<0.5?'b':r<0.85?'a':'r';mu=true}return {g,mu}}
function hm(g,grp,i){let s=0,n=0;for(const L of LOCI)if(L.g===grp){s+=g[L.k][i];n++}return s/n}
function gmean(g,grp){let s=0,n=0;for(const L of LOCI)if(L.g===grp){s+=g[L.k][0]+g[L.k][1];n+=2}return s/n}
function dom(pair,T){return T[pair[0]].d<=T[pair[1]].d?pair[0]:pair[1]}
function shapeInfo(s){
  if(s<=ANCH[0])return {i:0,perf:100,odd:false};
  if(s>=ANCH[4])return {i:4,perf:100,odd:false};
  let j=0;while(s>ANCH[j+1])j++;
  const lo=ANCH[j],hi=ANCH[j+1],mid=(lo+hi)/2,half=(hi-lo)/2,i=s<mid?j:j+1;
  const perf=Math.max(0,100*(1-ab(s-ANCH[i])/half));
  return {i,perf,odd:perf<12};
}
function colorName(r,y,p,g){
  if(g>0.7&&r>0.5)return '黑褐';
  if(g>0.7)return '綠';
  if(p>0.6)return '紫';
  if(r<0.25&&y<0.25&&p<0.3)return '白';
  if(r>=0.55&&y<0.45)return '紅';
  if(r>=0.3&&r<0.55&&y<0.3)return '粉';
  if(y>=0.5&&r<0.35)return '黃';
  return '橙';
}
const lv3=(v,a,b)=>v<a?0:v<b?1:2;
const RATIO_N=['扁','比例標準','長'],TWIST_N=['無扭轉','輕微扭轉','明顯扭轉'];
function stabName(x){return x>=1?'完全穩定':x>=0.97?'高度穩定':x>=0.9?'穩定':x>=0.75?'稍微穩定':'不穩定'}
const phCache=new WeakMap();
function phen(g,crop='tomato'){
  const hit=phCache.get(g);if(hit&&hit.crop===crop)return hit.ph;
  const cd=CROPS[crop]||CROPS.tomato;
  const ab_={yield:gmean(g,'yield')*100,taste:gmean(g,'taste')*100,speed:gmean(g,'speed')*100,resist:gmean(g,'resist')*100};
  const quality=(ab_.yield+ab_.taste+ab_.speed+ab_.resist)/4;
  const s=gmean(g,'shape'),sh=shapeInfo(s);
  const ratio=gmean(g,'ratio'),twist=gmean(g,'twist');
  const pig={r:gmean(g,'pr'),y:gmean(g,'py'),p:gmean(g,'pp'),g:gmean(g,'pg')};
  const spec=dom(gl(g,'spec'),SPEC);
  const cname=spec!=='n'?SPEC_N[spec]:colorName(pig.r,pig.y,pig.p,pig.g);
  const surf=dom(g.surf,SURF),pat=dom(g.pat,PAT);
  const hA={r:hm(g,'pr',0),y:hm(g,'py',0),p:hm(g,'pp',0),g:hm(g,'pg',0)},hB={r:hm(g,'pr',1),y:hm(g,'py',1),p:hm(g,'pp',1),g:hm(g,'pg',1)};
  const skin=pigColor(pig),ca=pigColor(hA),cb=pigColor(hB),dd=(x,y)=>Math.hypot(x[0]-y[0],x[1]-y[1],x[2]-y[2]);
  const pk=dd(ca,skin)>=dd(cb,skin)?[ca,hA]:[cb,hB];

const plantCache=new WeakMap();
function plantSVG(p,x,y){

  const key=p.stage+'|'+Math.floor(prr*12)+'|'+p.watered+'|'+x+'|'+y;
  const hit=plantCache.get(p);if(hit&&hit.key===key)return hit.svg;
  let s='';
  if(p.stage==='seedling'){const h=10+22*prr;s+=`<path d="M${x} ${y} L${x} ${y-h}" stroke="#3F8F2A" stroke-width="3" stroke-linecap="round"/>`+leaf(x,y-h+2,-150,0.7+0.4*prr)+leaf(x,y-h+2,-30,0.7+0.4*prr)}
  else{
    s+=bodySVG(cd.body,x,y,p.stage==='flower',cd.fl);
    if(p.stage==='fruit'||p.stage==='ripe'){
      const sz=(p.stage==='ripe'?1:0.5+0.4*prr)*cd.fs;

      if(p.stage==='ripe')s+=`<path d="M${x+26} ${y-78} l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5z" fill="#FFD54A" stroke="#9A6A00" stroke-width="1.2" stroke-linejoin="round"/>`;

  plantCache.set(p,{key,svg:s});

}

function mergeIdentical(){
  if(!state)return 0;const seen=new Map();let merged=0;

    t.germ=(t.germ*nt+l.germ*nl)/Math.max(1,nt+nl);
    for(const p of state.plots)if(p&&p.lotId===l.id)p.lotId=t.id;

}

async function lotAction(act,b){
  const l=state.lots.find(x=>x.id===sheet.lot);if(!l)return closeSheet();

  }
}

function pollinate(i,j){
  const p=state.plots[i];
  if(j==null)p.pollen={type:'self'};
  else{const q=state.plots[j];if(q&&q.crop===p.crop&&rnd()<crossRate(p,q)){p.pollen={type:'cross',fatherG:clone(q.g),fatherName:pname(q)};toast('雜交成功')}else{p.pollen={type:'self'};toast('這次雜交沒有成功，植株改為自己授粉')}}
  p.stage='fruit';p.prog=0;p.watered=false;p.fert=false;tutEv('pollinate');
}
function takeSeeds(i){
  const p=state.plots[i],ph=phen(p.g,p.crop),cross=p.pollen&&p.pollen.type==='cross';
  if(!state.selfC)state.selfC={};
  const base=p.name.replace(/-\d+$/,'');
  const f=cross?p.pollen.fatherG:p.g,name=cross?`品系 ${state.nextLine++}`:`${base}-${state.selfC[base]=(state.selfC[base]||0)+1}`,lid=cross?'L'+(state.nextLid++):p.lid;
  const source=cross?`${pname(p)} × ${p.pollen.fatherName}`:`${pname(p)} 自己授粉`;
  const n=SEEDN[ph.tier],seeds=[];let mu=0;
  for(let k=0;k<n;k++){const c=child(p.g,f);seeds.push(c.g);if(c.mu)mu++}
  state.lots.unshift({id:state.nextLot++,lid,crop:p.crop,name,source,m:clone(p.g),f:clone(f),seeds,germ:GERM[ph.tier],cross:!!cross});
  state.plots[i]=null;
  toast(mu?`得到 ${n} 顆種子，裡面好像有特別的變化`:`得到 ${n} 顆種子，放進種子袋了`);
  harvested(ph);if(cross)orderDone('cross');
}

function tick(){
  if(!state)return;
  const now=Date.now();let dt=now-state.last;if(dt<0)dt=0;state.last=now;
  const gdt=dt*state.speed;let changed=false,flowered=false;
  state.plots.forEach((p,i)=>{
    if(!p)return;
    if(p.stage==='seedling'||p.stage==='fruit'){
      if(p.watered){p.prog+=gdt*(p.fert?1.25:1);if(p.prog>=stageDur(p,phen(p.g,p.crop))){p.prog=0;p.watered=false;p.fert=false;if(p.stage==='seedling')flowered=true;p.stage=p.stage==='seedling'?'flower':'ripe';p.flowerT=0;changed=true}}
    }else if(p.stage==='flower'){p.flowerT+=gdt;if(p.flowerT>=24*HOUR){pollinate(i,null);changed=true}}
  });
  if(flowered)tutEv('flower');
  if(changed){save();renderAll()}else if(scene==='farm'&&!viewing)renderWorld();
  if(sheet&&sheet.i!=null){
    const p=state.plots[sheet.i],st=p?p.stage:'empty';
    if(st!==sheet.stage){sheet.stage=st;renderSheet()}
    else if(p&&p.stage!=='ripe'&&sheet.crossFrom==null){const pi=progInfo(p),b=document.getElementById('pbar'),t=document.getElementById('ptime');if(b)b.style.width=pi.pct+'%';if(t)t.textContent=pi.txt}
  }
}

  const onMsg=(arr,kind)=>s=>{
    const docs=s.docs.map(d=>({id:d.id,...d.data()}));
    if(kind==='to'&&msgReady){for(const ch of s.docChanges())if(ch.type==='added'){const m=ch.doc.data();if(!(sheet&&sheet.dm===m.from)){dmUnread.add(m.from);toast(`${m.fromName} 傳了私訊給你`)}}}
    if(kind==='pub')msgPub=docs;else if(kind==='to')msgTo=docs;else msgFrom=docs;
    renderSocial();if(sheet&&sheet.dm&&kind!=='pub')renderSheet();
  };

  unsubs.push(db.collection('messages').where('to','==',uid).onSnapshot(s=>{onMsg(null,'to')(s);msgReady=true},()=>{}));

}

    h+=lots.length?lots.map(l=>{const ph=phen(l.m,l.crop);return `<button class="pick" data-act="spick" data-lot="${l.id}">${fruitSVG(ph,l.crop,44)}<span><b>${esc(l.name)}</b><span class="meta">${CROPS[l.crop].n}・剩 ${lc(l)} 顆・品質 ${ph.quality.toFixed(1)}・${TIERS[ph.tier]}</span></span></button>`}).join(''):'<p class="note">這個分類沒有種子。</p>';
    return h+`<button class="btn" data-act="sback">返回</button>`;
  }
  if(sheet.step==='form'){
    const l=state.lots.find(x=>x.id===sheet.lot);if(!l){sheet.step='pick';return stallHTML()}
    const ph=phen(l.m,l.crop),n=lc(l);
    return h+`<div class="lot-top">${fruitSVG(ph,l.crop,56)}<div><div class="lot-name">${esc(l.name)}</div><div class="meta">${CROPS[l.crop].n}・剩 ${n} 顆</div></div></div><div class="regbox sellbox"><label>數量（最多 ${n} 顆）<input id="f1" type="number" inputmode="numeric" min="1" max="${n}" value="${esc(sheet.d1)}"></label><label>價格（金幣）<input id="f2" type="number" inputmode="numeric" min="1" value="${esc(sheet.d2)}"></label><div class="err" id="ferr">${sheet.err}</div><div class="row2"><button class="btn primary" data-act="ssave">確定上架</button><button class="btn" data-act="sback">返回</button></div></div>`;
  }
  if(!inf.owner)h+=`<p class="note">這個攤位目前沒人使用。在這裡上架種子就能占用它，全部賣完後攤位會自動空出來，讓別人使用。</p><button class="btn primary" data-act="sstart">在這裡上架種子</button>`;
  else if(inf.owner===uid)h+=`<p class="note">你有 ${inf.ls.length} 包種子在這裡販售。朋友買走後，金幣會自動入帳。</p><button class="btn primary" data-act="sstart">再上架一包</button>`+inf.ls.map(listingCard).join('');
  else h+=`<p class="note">${esc(inf.ownerName)} 正在販售 ${inf.ls.length} 包種子。</p>`+inf.ls.map(listingCard).join('');

}
function bindStall(){
  const f1=document.getElementById('f1'),f2=document.getElementById('f2');
  const clr=()=>{if(sheet.err){sheet.err='';const e=document.getElementById('ferr');if(e)e.textContent=''}};
  if(f1)f1.addEventListener('input',()=>{sheet.d1=f1.value;clr()});
  if(f2)f2.addEventListener('input',()=>{sheet.d2=f2.value;clr()});
}
async function stallAction(b){
  const act=b.dataset.act,i=sheet.stall;
  if(act==='sstart'){sheet.step='pick';renderSheet();return}
  if(act==='sback'){sheet.step=sheet.step==='form'?'pick':'view';sheet.err='';renderSheet();return}
  if(act==='spick'){sheet.lot=+b.dataset.lot;sheet.step='form';sheet.d1='1';sheet.d2='';sheet.err='';renderSheet();return}
  if(act==='ssave'){
    const l=state.lots.find(x=>x.id===sheet.lot);if(!l)return;
    const inf=stallInfo(i);if(inf.owner&&inf.owner!==uid){sheet.err='這個攤位剛被別人占用了，換一個空攤位吧';renderSheet();return}
    const n=lc(l),k=parseInt(sheet.d1,10),price=parseInt(sheet.d2,10);
    if(!(k>=1&&k<=n)){sheet.err=`數量要在 1 到 ${n} 之間`;renderSheet();return}
    if(!(price>=1&&price<=999999)){sheet.err='請輸入 1 以上的價格';renderSheet();return}
    const payload={m:l.m,f:l.f,count:k,germ:l.germ};if(l.seeds)payload.seeds=l.seeds.slice(0,k);
    b.disabled=true;
    try{
      await db.collection('listings').add({crop:l.crop,name:l.name,source:l.source,sellerUid:uid,sellerName:myName(),price,count:k,stall:i,lot:JSON.stringify(payload),sold:false,createdAt:TS()});
      removeSeeds(l,k);save();renderAll();sheet.step='view';renderSheet();toast(`已在攤位上架 ${k} 顆「${l.name}」，售價 ${price} 金幣`);
    }catch(e){sheet.err='上架失敗，請檢查網路後再試一次';renderSheet()}
    return;
  }
  if(act==='sbuy'){
    const l=listings.find(x=>x.id===b.dataset.id);if(!l||l.sold)return;
    if(state.coins<l.price){toast('金幣不夠');return}
    b.disabled=true;
    try{
      await db.runTransaction(async tx=>{const ref=db.collection('listings').doc(l.id),d=await tx.get(ref);if(!d.exists||d.data().sold)throw new Error('gone');tx.update(ref,{sold:true,buyerUid:uid,buyerName:myName(),soldAt:TS()})});
      const lot=lotOf(l);state.coins-=l.price;
      state.lots.unshift({id:state.nextLot++,lid:'L'+(state.nextLid++),crop:l.crop,name:l.name,source:`向 ${l.sellerName} 購買`,m:lot.m,f:lot.f,count:lot.seeds?0:lot.count,seeds:lot.seeds||undefined,germ:lot.germ});
      save();renderAll();toast(`買到 ${l.count} 顆「${l.name}」，已放進種子袋`);
    }catch(err){toast('這包種子已經被買走了');b.disabled=false}
    return;
  }
  if(act==='scancel'){
    const l=listings.find(x=>x.id===b.dataset.id);if(!l||l.sold)return;
    b.disabled=true;
    try{
      await db.collection('listings').doc(l.id).delete();
      const lot=lotOf(l);
      state.lots.unshift({id:state.nextLot++,lid:'L'+(state.nextLid++),crop:l.crop,name:l.name,source:l.source,m:lot.m,f:lot.f,count:lot.seeds?0:lot.count,seeds:lot.seeds||undefined,germ:lot.germ});
      save();renderAll();toast('已收回，種子放回種子袋');
    }catch(err){toast('收回失敗，可能已經被買走了');b.disabled=false}
  }
}

function nearest(){
  const m=curMe();
  if(scene==='market'){
    let bi=-1,bdist=1e9;STALLS.forEach(([x,y],i)=>{const d=Math.hypot(x-m.x,(y-m.y)*1.3);if(d<bdist){bdist=d;bi=i}});
    if(bdist<72)return {t:'stall',i:bi};
    const [gx,gy]=GATE.market;if(Math.hypot(gx-m.x,gy-m.y)<56)return {t:'gate'};return null;
  }
  const [gx,gy]=GATE.farm;if(Math.hypot(gx-m.x,gy-m.y)<56)return {t:'gate'};
  let best=-1,b2=1e9;for(let i=0;i<NPLOTS;i++){const [x,y]=center(i),dx=x-m.x,dy=(y-m.y)*1.7,d2=dx*dx+dy*dy;if(d2<b2){b2=d2;best=i}}
  return b2<48*48?{t:'plot',i:best}:null;
}
function actInfo(n){
  if(!n)return {label:'互動',on:false};
  if(n.t==='gate')return {label:scene==='market'?'回農場':'去市集',on:true};

  if(viewing){const p=viewing.st&&viewing.st.plots[n.i];return {label:p?'查看':'空地',on:!!p}}
  const p=state.plots[n.i];
  if(!p)return {label:'播種',on:true};
  if((p.stage==='seedling'||p.stage==='fruit')&&!p.watered)return {label:'澆水',on:true};
  if(p.stage==='flower')return {label:'授粉',on:true};
  if(p.stage==='ripe')return {label:'收成',on:true};
  return {label:'查看',on:true};
}

const joyEl=document.getElementById('joy'),knob=document.getElementById('joyKnob');
let joy={id:null,vx:0,vy:0},raf=null,lastF=0;
function joySet(e){const r=joyEl.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const R=r.width/2-16,len=Math.hypot(dx,dy);if(len>R){dx*=R/len;dy*=R/len}knob.style.transform=`translate(${dx}px,${dy}px)`;joy.vx=dx/R;joy.vy=dy/R}
function startLoop(){if(!raf){lastF=performance.now();raf=requestAnimationFrame(walkLoop)}}
joyEl.addEventListener('pointerdown',e=>{e.preventDefault();joy.id=e.pointerId;try{joyEl.setPointerCapture(e.pointerId)}catch(err){}joySet(e);startLoop()});
joyEl.addEventListener('pointermove',e=>{if(e.pointerId===joy.id){e.preventDefault();joySet(e)}});
const joyEnd=e=>{if(e.pointerId!==joy.id)return;joy={id:null,vx:0,vy:0};knob.style.transform=''};
joyEl.addEventListener('pointerup',joyEnd);joyEl.addEventListener('pointercancel',joyEnd);
const keys={};
window.addEventListener('keydown',e=>{if(!state||e.target.closest('input,textarea,select')||curPanel||sheet)return;const k=['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','a','d','w','s'].includes(e.key);if(k){keys[e.key]=1;e.preventDefault();startLoop()}if(e.key==='e'||e.key===' '){e.preventDefault();interact()}});
window.addEventListener('keyup',e=>{delete keys[e.key]});
function walkLoop(t){
  const dt=Math.min(0.05,(t-lastF)/1000);lastF=t;
  let vx=joy.vx,vy=joy.vy;
  if(keys.ArrowLeft||keys.a)vx=-1;if(keys.ArrowRight||keys.d)vx=1;if(keys.ArrowUp||keys.w)vy=-1;if(keys.ArrowDown||keys.s)vy=1;
  const mv=Math.hypot(vx,vy)>0.12&&state&&!curPanel;
  if(mv){
    const m=curMe(),{W,H}=scene==='market'?WORLD.market:WORLD.farm,len=Math.max(1,Math.hypot(vx,vy));
    m.x=clamp(m.x+vx/len*Math.min(1,len)*160*dt,24,W-24);m.y=clamp(m.y+vy/len*Math.min(1,len)*130*dt,74,H-26);
    if(ab(vx)>0.15)meDir=vx<0?-1:1;walkPh+=dt*12;updateMe();updateCam();pushPos(false);refreshAct();
    raf=requestAnimationFrame(walkLoop);
  }else{raf=null;walkPh=0;if(state){updateMe();pushPos(true);if(scene==='farm'&&!viewing)save()}}
}

// ===== 角色編輯 =====
function openAvatar(){sheet={avatar:true,draft:{...AV_DEF,...(state.avatar||{})}};renderSheet();openSheetUI()}
function avatarEditorHTML(){
  const d=sheet.draft;
  const row=k=>`<div class="avrow"><span>${AV_LBL[k]}</span><button class="mini" data-av="${k}" data-d="-1" aria-label="上一個">‹</button><b>${AV_OPT[k][d[k]]}</b><button class="mini" data-av="${k}" data-d="1" aria-label="下一個">›</button></div>`;
  const sw=(k,arr)=>`<div class="avrow"><span>${AV_LBL[k]}</span><div class="sw">${arr.map((c,i)=>`<button class="swatch" style="background:${c}" data-avc="${k}" data-v="${i}" aria-label="${AV_LBL[k]} ${i+1}" aria-pressed="${d[k]===i}"></button>`).join('')}</div></div>`;
  return `<h2>我的角色</h2><div class="hero"><svg viewBox="-26 -54 52 58" width="150" height="168" role="img" aria-label="角色預覽">${avatarSVG(d,false,0)}</svg></div>${sw('skin',SKINS)}${row('face')}${row('hair')}${sw('hairC',HAIRC)}${row('top')}${sw('topC',CLOTHC)}${row('bottom')}${sw('bottomC',CLOTHC)}${row('acc')}<button class="btn primary" data-act="avsave">儲存角色</button>`;
}
function avatarAction(b){
  const d=sheet.draft;
  if(b.dataset.av){const k=b.dataset.av,n=AV_OPT[k].length;d[k]=(d[k]+(+b.dataset.d)+n)%n;renderSheet();return}
  if(b.dataset.avc){d[b.dataset.avc]=+b.dataset.v;renderSheet();return}
  if(b.dataset.act==='avsave'){state.avatar={...d};save();db.collection('profiles').doc(uid).set({avatar:state.avatar},{merge:true}).catch(()=>{});pushPos(true);renderChars();closeSheet();toast('角色已更新')}
}
sb.addEventListener('click',e=>{if(!sheet||!sheet.avatar)return;const b=e.target.closest('[data-av],[data-avc]');if(b){e.stopPropagation();avatarAction(b)}},true);
const avB=document.getElementById('avatarBtn2');if(avB)avB.onclick=()=>{closePanel();openAvatar()};


document.getElementById('speedBtn').onclick=()=>{tick();state.speed=state.speed>1?1:20;save();renderSpeed();toast(state.speed>1?'已開啟加速測試':'已關閉加速測試')};
let resetArm=false;
document.getElementById('resetBtn').onclick=e=>{
  if(!resetArm){resetArm=true;e.target.textContent='再按一次，確定清除所有進度';return}
  resetArm=false;e.target.textContent='重新開始';newGame();ensureCrops();save();closeSheet();closePanel();goFarm();renderAll();tutRender();renderOrdersBtn();toast('已重新開始');
};

const TUT=[
  {t:'歡迎來到種子的世界！我是農會的阿伯。用左下角的搖桿走到一塊空地旁，按右下角的「播種」，挑一包種子種下去吧。',ev:'plant'},
  {t:'發芽了！頭上的水滴代表需要澆水。走到它旁邊按「澆水」，或按「全部澆水」。',ev:'water'},
  {t:'澆了水就會慢慢長大，每個階段都要再澆一次。想快一點，可以在右邊「設定」開啟加速測試。等它開花吧。',ev:'flower'},
  {t:'開花了！走過去按「授粉」，可以自己授粉，或和另一株同時開花的同種作物雜交。',ev:'pollinate'},
  {t:'再澆水讓果實長大，成熟後按「收成」，可以賣掉換金幣，或取種留著培育。',ev:'harvest'},
  {t:'做得很好！右邊的圖示可以打開種子袋、圖鑑、朋友和裝飾。走到農場最下面的大門，或按「市集」，就能去市集擺攤、和大家見面。完成「訂單」還有金幣可拿喔！',btn:'開始玩'}
];
function tutRender(){
  const el=document.getElementById('tut'),t=state&&state.tut;
  if(!t||t.done){el.hidden=true;return}
  const st=TUT[Math.min(t.step,TUT.length-1)];el.hidden=false;
  document.getElementById('tutText').textContent=st.t;
  const nb=document.getElementById('tutNext');nb.hidden=!st.btn;nb.textContent=st.btn||'';
  document.getElementById('tutStep').textContent=`${Math.min(t.step+1,TUT.length)} / ${TUT.length}`;
}
function tutEv(ev){const t=state&&state.tut;if(!t||t.done)return;const st=TUT[t.step];if(st&&st.ev===ev){t.step++;save();tutRender()}}
document.getElementById('tutNext').onclick=()=>{state.tut.done=true;save();tutRender()};
document.getElementById('tutSkip').onclick=()=>{state.tut.done=true;save();tutRender();toast('已略過教學')};
const ORDERS=[{k:'harvest',t:'收成任何一種作物一次',r:100},{k:'cross',t:'完成一次雜交並取得種子',r:150},{k:'yellow',t:'收成一株黃色的作物',r:200}];
function harvested(ph){tutEv('harvest');orderDone('harvest');if(ph&&ph.cname==='黃')orderDone('yellow')}
function orderDone(k){if(!state.orders)state.orders={};if(!state.orders[k]){state.orders[k]=1;save();toast('完成了一張訂單，到「訂單」領取獎勵');renderOrdersBtn()}}
function renderOrdersBtn(){const n=ORDERS.filter(o=>(state.orders||{})[o.k]===1).length,done=ORDERS.every(o=>(state.orders||{})[o.k]===2);document.getElementById('ordersBtn').hidden=done;const bg=document.getElementById('ordersBadge');bg.hidden=!n;bg.textContent=n}
document.getElementById('ordersBtn').onclick=()=>{sheet={orders:true};renderSheet();sheetEl.classList.add('open');bd.style.display='block'};
function ordersHTML(){const o=state.orders||{};return `<h2>入門訂單</h2><p class="note">農會阿伯的委託，完成後可以領取金幣。</p>`+ORDERS.map(x=>`<div class="lot"><div class="lot-name">${x.t}</div><div class="meta">獎勵 ${x.r} 金幣</div>${o[x.k]===2?'<p class="note">已領取</p>':o[x.k]===1?`<button class="btn primary" data-act="claim" data-k="${x.k}">領取 ${x.r} 金幣</button>`:'<p class="note">進行中</p>'}</div>`).join('')+'<button class="btn" data-act="close">關閉</button>'}
function orderAction(b){if(b.dataset.act!=='claim')return;const x=ORDERS.find(o=>o.k===b.dataset.k);if(!x||state.orders[x.k]!==1)return;state.orders[x.k]=2;state.coins+=x.r;save();renderCoins();renderOrdersBtn();renderSheet();toast(`領取了 ${x.r} 金幣`)}
let loop=null;
const loginEl=document.getElementById('login');
if(/Line\/|FBAN|FBAV|Instagram|MicroMessenger/i.test(navigator.userAgent))document.getElementById('inapp').hidden=false;
document.getElementById('loginBtn').onclick=async()=>{
  const err=document.getElementById('loginErr');err.textContent='';
  const provider=new firebase.auth.GoogleAuthProvider();
  try{await auth.signInWithPopup(provider)}
  catch(e){
    if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment'){try{await auth.signInWithRedirect(provider)}catch(e2){err.textContent='登入失敗：'+e2.code}}
    else if(e.code==='auth/popup-closed-by-user'||e.code==='auth/cancelled-popup-request')err.textContent='登入視窗被關掉了，請再按一次登入。';
    else if(e.code==='auth/unauthorized-domain')err.textContent='這個網址還沒加入 Firebase 的授權網域。';
    else err.textContent='登入失敗：'+e.code;
  }
};
document.getElementById('logoutBtn').onclick=async()=>{await flush();leavePresence();if(viewing){viewing.unsub&&viewing.unsub();viewing=null}await auth.signOut()};
auth.onAuthStateChanged(async user=>{
  if(!user){stopListeners();uid=null;state=null;closeSheet();loginEl.hidden=false;return}
  uid=user.uid;loginEl.hidden=true;setSync('loading');
  document.getElementById('account').textContent='目前登入：'+(user.displayName||'')+(user.email?'（'+user.email+'）':'');
  try{const rs=await db.collection('registry').get();regList=rs.docs.map(d=>({id:d.id,...d.data()}));sortReg()}catch(e){}
  let cloud=null;
  try{const snap=await db.collection('players').doc(uid).get();if(snap.exists&&snap.data().save)cloud=migrate(JSON.parse(snap.data().save))}catch(e){setSync('err')}
  const local=load();
  if(cloud&&local)state=(local.savedAt||0)>(cloud.savedAt||0)?local:cloud;else state=cloud||local;
  if(!state)newGame();
  ensureCrops();
  dirty=true;flush();
  db.collection('profiles').doc(uid).set({name:myName(),avatar:state.avatar||AV_DEF,at:TS()},{merge:true}).catch(()=>{});
  startListeners();startSocial();
  closePanel();scene='farm';viewing=null;renderHUD();renderAll();tick();tutRender();renderOrdersBtn();joinFarm(uid);renderChars();updateCam();refreshAct();
  if(!loop)loop=setInterval(tick,1000);
});
document.addEventListener('visibilitychange',()=>{if(document.hidden)flush();else tick()});
window.addEventListener('pagehide',()=>{flush()});
</script>
